# Build msquic with BinaryBuilder on GitHub's Linux runners (no docker needed there), one
# platform per job for quick feedback. The deploy job, started by hand, builds every
# platform in one go and publishes a JLL package to f3liz-casa/msquic_jll with the
# tarballs on a GitHub Release. Deploy needs a PAT with repo scope in JLL_DEPLOY_TOKEN.
name: msquic_jll

on:
  push:
    branches: [main]
    paths:
      - deps/yggdrasil/msquic/**
      - .github/workflows/msquic-jll.yml
  pull_request:
    paths:
      - deps/yggdrasil/msquic/**
      - .github/workflows/msquic-jll.yml
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish to f3liz-casa/msquic_jll (needs JLL_DEPLOY_TOKEN)"
        type: boolean
        default: false

env:
  BINARYBUILDER_AUTOMATIC_APPLE: "true"
  BINARYBUILDER_USE_CCACHE: "true"

jobs:
  build:
    if: ${{ !inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-linux-gnu
          - i686-linux-gnu
          - aarch64-linux-gnu
          - armv6l-linux-gnueabihf
          - armv7l-linux-gnueabihf
          - powerpc64le-linux-gnu
          - riscv64-linux-gnu
          - x86_64-linux-musl
          - i686-linux-musl
          - aarch64-linux-musl
          - armv6l-linux-musleabihf
          - armv7l-linux-musleabihf
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Install BinaryBuilder
        run: julia -e 'using Pkg; Pkg.add("BinaryBuilder")'
      - name: Build ${{ matrix.platform }}
        run: julia deps/yggdrasil/msquic/build_tarballs.jl --verbose ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: msquic-${{ matrix.platform }}
          path: products/*.tar.gz
          if-no-files-found: error

  deploy:
    if: ${{ inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1"
      - uses: julia-actions/cache@v2
      - name: Install BinaryBuilder
        run: julia -e 'using Pkg; Pkg.add("BinaryBuilder")'
      - name: Build every platform and publish msquic_jll
        env:
          GITHUB_TOKEN: ${{ secrets.JLL_DEPLOY_TOKEN }}
        run: julia deps/yggdrasil/msquic/build_tarballs.jl --verbose --deploy=f3liz-casa/msquic_jll
